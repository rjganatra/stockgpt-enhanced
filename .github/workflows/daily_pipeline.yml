name: Daily Pipeline

# Same two-run schedule as the original repo's phase6_pipeline.yml (kept
# deliberately, not guessed): 04:30 UTC / 10:00 IST is before the NSE open
# (09:15 IST), 10:10 UTC / 15:40 IST is just before the close (15:30 IST) --
# a pre-open read and a near-close read, weekdays only.
on:
  schedule:
    - cron: "30 4 * * 1-5"
    - cron: "10 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline (universe -> scan -> relative strength -> range bound -> merge fundamentals -> final score -> history/changes)
        run: python scripts/run_daily_pipeline.py

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "Daily pipeline update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes"
          git pull --rebase origin main
          git push

      - name: Send alerts (new High Conviction, saved strategy matches, watchlist changes)
        # Best-effort by design: a delivery failure here (bad token, SMTP
        # hiccup) is reported in the log but does not fail this job -- the
        # pipeline's main job (updating and committing data) already
        # succeeded above, and that should stay green independent of
        # whether a notification channel is currently working.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/run_alerts.py
