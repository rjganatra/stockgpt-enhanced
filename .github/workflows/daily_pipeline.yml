name: Daily Pipeline

# Same two-run schedule as the original repo's phase6_pipeline.yml (kept
# deliberately, not guessed): 04:30 UTC / 10:00 IST is before the NSE open
# (09:15 IST), 10:10 UTC / 15:40 IST is just before the close (15:30 IST) --
# a pre-open read and a near-close read, weekdays only.
on:
  schedule:
    - cron: "30 4 * * 1-5"
    - cron: "10 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline (universe -> scan -> relative strength -> range bound -> merge fundamentals -> final score -> history/changes)
        run: python scripts/run_daily_pipeline.py

      - name: Trim today's snapshot to the memory-safe symbol set
        # run_daily_pipeline.py scans close to the full ~2,000-symbol
        # universe by design -- necessary for Overview/Opportunities/etc.,
        # which read data/scans/latest_scan.csv (today only, always full
        # size, untouched here). But every day this same full-size snapshot
        # also gets added to data/history, which is what the dashboard
        # loads as one big multi-year panel -- left unchecked, that panel
        # would silently grow back to the ~2,000-symbol scale one ordinary
        # day at a time, exactly undoing the deliberate 250-symbol backfill
        # trim (see README's "Historical backfill" section) and eventually
        # crashing the deployed app again. --latest-only caps only today's
        # new day, never re-touches already-trimmed historical days.
        run: python scripts/trim_history_symbols.py --keep-top 250 --latest-only

      - name: Prune history older than the retention window
        # Keeps data/history a rolling window instead of growing forever --
        # one new day gets added above, one day that just aged out gets
        # removed here, in the same commit. Without this, the exact
        # memory problem the historical backfill hit once (see README's
        # "Historical backfill" section) would eventually recur on its
        # own, one ordinary day at a time, years from now.
        run: python scripts/prune_history.py --keep-years 3

      - name: Export precomputed dashboard data
        # Sector rotation, per-symbol score history, signal performance, and
        # the strategy leaderboard used to be computed live in the Streamlit
        # process, which meant loading the ENTIRE multi-year history panel
        # into server RAM on every page view -- the actual root cause of
        # this app's recurring memory crashes. This computes all four here,
        # once, and writes small files under data/exports/ that the
        # dashboard just reads. See scripts/export_dashboard_data.py's
        # module docstring for the full reasoning.
        run: python scripts/export_dashboard_data.py

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "Daily pipeline update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes"
          git pull --rebase origin main
          git push

      - name: Send alerts (new High Conviction, saved strategy matches, watchlist changes)
        # Best-effort by design: a delivery failure here (bad token, SMTP
        # hiccup) is reported in the log but does not fail this job -- the
        # pipeline's main job (updating and committing data) already
        # succeeded above, and that should stay green independent of
        # whether a notification channel is currently working.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/run_alerts.py
