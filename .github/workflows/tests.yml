name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile every module (fast syntax/import sanity check)
        run: |
          python -m py_compile src/stockgpt/*.py src/stockgpt/backtest/*.py scripts/*.py dashboard/app.py

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Setup Node (for the JS backtest engine port)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cross-verify JS backtest engine against the Python engine
        # dashboard/static/{query_parser,backtest_engine}.js is a from-scratch
        # port of src/stockgpt/backtest/{engine,metrics,walkforward,portfolio}.py
        # that runs client-side (Strategy Lab, sweep, walk-forward, portfolio
        # backtest). This regenerates a synthetic fixture, runs it through the
        # REAL Python engine, then runs the JS engine on the identical panel
        # and diffs every number -- catches a silent logic drift between the
        # two engines, not just "does the JS file parse".
        run: |
          python tests/js/gen_fixture.py
          node tests/js/crossverify.node.js

      - name: Unit-test the browser widget's data-shaping helpers
        # dashboard/static/panel_loader.js is the pure (no fetch/DOM/IndexedDB)
        # data-shaping layer widget_app.js builds on -- quarter-range math and
        # the JSON null->NaN conversion the shard files require. Uses Node's
        # built-in test runner, no extra dependency.
        run: node --test tests/js/panel_loader.test.js

      - name: Stage sample data for the dashboard smoke test
        run: |
          mkdir -p data/scans data/history
          cp examples/sample_scan_latest.csv data/scans/latest_scan.csv
          cp -r examples/sample_history/* data/history/

      - name: Dashboard smoke test (real sample data, real Streamlit script run)
        run: |
          python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('dashboard/app.py', default_timeout=90)
          at.run()
          assert not at.exception, at.exception
          print('Dashboard smoke test passed:', len(at.tabs), 'tabs, no exceptions')
          "
